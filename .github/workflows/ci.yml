name: ci
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        dir: [field-manual, handbook]
    steps:
      - uses: actions/checkout@v4
      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential python3 python3-numpy python3-scipy
      - name: Test
        run: make -C ${{ matrix.dir }} test
      - name: Generated headers are up to date
        run: make -C ${{ matrix.dir }} check-generated
      - name: ASan + UBSan
        run: make -C ${{ matrix.dir }} sanitize
